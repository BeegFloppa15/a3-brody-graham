<!doctype html>
<html lang='en'>
  <head>
    <title>Play Math Maker!</title>
    <meta charset='utf-8' />
    <script src='js/main.js'></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/beercss@5.0.3/dist/cdn/beer.min.css" rel="stylesheet">
    <link href="css/colors.css" rel="stylesheet">
    <script type="module" src="https://cdn.jsdelivr.net/npm/beercss@5.0.3/dist/cdn/beer.min.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/material-dynamic-colors@1.1.4/dist/cdn/material-dynamic-colors.min.js"></script>
    
    <!-- get rid of favicon error -->
    <link rel='icon' href='data:;base64,iVBORw0KGgo=' />
  </head>
  <body>
    <dialog id="logout-dialog">
      <h5>Log Out</h5>
      <div>Are you sure you want to log out?
      </div>
      <nav class="right-align no-space">
        <button class="transparent link" data-ui="#logout-dialog">Cancel</button>
        <a href="logout">
          <button class="transparent link">Logout</button>
        </a>
      </nav>
    </dialog>
    <header class="fill">
      <nav>
        <a href="changeInfo.html">
          <button id="username-display">Username</button>
        </a>
        <div class="max"></div>
        <p id="correct-count">Correct Guesses:</p>
        <P id="total-count">Total Guesses:</P>
        <p id="accuracy">Accuracy:</p>
        <div class="max"></div>
        <button data-ui="#logout-dialog">Logout</button>
      </nav>
    </header>
    <main>
      <section class="padding border responsive">
        <div class="padding center-align">
          <h1>Solve The Problem</h1>
          <form>
            <h3 id="problem" class="fill medium" style="font-family: 'Times New Roman', Times, serif;">???</h3>
            <div class="field border prefix">
              <progress id="answer-waiting" class="circle indeterminate " value="50" max="100" hidden></progress>
              <input id="answer" type="number">
              <output>Answer Here</output>
            </div>
            <button id ='submit'>submit</button>
          </form>
          <div id="result" class="primary-container">
            <h1>Correct!</h1>
          </div>
        </div>
      </section>
      <section class="game-element">
        <h1>Leaderboard</h1>
        <table>
          <thead>
            <tr>
              <th scope="col">Rank</th>
              <th scope="col">Username</th>
              <th scope="col">Correct Guesses</th>
              <th scope="col">Total Guesses</th>
              <th scope="col">Accuracy</th>
            </tr>
          </thead>
          <tbody id="leaderboard-players">
          </tbody>
        </table>
      </section>
    </main>
  </body>
</html>
