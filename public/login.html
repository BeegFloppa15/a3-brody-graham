<!doctype html>
<html lang='en'>
  <head>
    <title>Math Maker - Login</title>
    <meta charset='utf-8' />
    <script src='js/login.js'></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/beercss@5.0.3/dist/cdn/beer.min.css" rel="stylesheet">
    <link href="css/colors.css" rel="stylesheet">
    <script type="module" src="https://cdn.jsdelivr.net/npm/beercss@5.0.3/dist/cdn/beer.min.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/material-dynamic-colors@1.1.4/dist/cdn/material-dynamic-colors.min.js"></script>
    
    <!-- get rid of favicon error -->
    <link rel='icon' href='data:;base64,iVBORw0KGgo=' />
  </head>
  <body>
    <header class="fill">
      <nav>
        <h6 class="max center-align">Log In</h6>
      </nav>
    </header>
    <main class="center-align">
      <article class="container large-width center">
        <div class="padding">
          <form action="login/attempt" method="post">
            <div class="field label border">
              <input type="text" name="username" aria-label="Username Entry" id = "username-entry">
              <label>Username</label>
            </div>
            <div class="field label border">
              <input type="password" name="password" aria-label="Password Entry" id = "password-entry">
              <label>Password</label>
            </div>
            <button type="submit" value="Log In" id="login" class="large align-center" style="margin: 18px">Log In</button>
          </form>
        </div>
      </article>
      <article class="responsive center-align large-width center"> 
        No Account? <button><a href="register.html">Register Here</a></button>
      </article>
    </main>
  </body>
</html>
