<!doctype html>
<html lang='en'>
  <head>
    <title>Math Maker - Login</title>
    <meta charset='utf-8' />
    <script src='js/login.js'></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <link rel='stylesheet' href='css/main.css' />
    
    <!-- get rid of favicon error -->
    <link rel='icon' href='data:;base64,iVBORw0KGgo=' />
  </head>
  <body>
    <form action="login/attempt" method="post">
        <input type="text" name="username" aria-label="Username Entry" id = "username-entry">
        <label for="username-entry">Username</label>
        <input type="password" name="password" aria-label="Password Entry" id="password-entry">
        <label for="password-entry">Password</label>
        <input type="submit" value="Log In" id="login">
    </form>
  </body>
</html>
